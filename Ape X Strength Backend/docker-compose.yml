services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apexstrength_test
      POSTGRES_USER: apexstrength
      POSTGRES_PASSWORD: test-password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexstrength -d apexstrength_test"]
      interval: 2s
      timeout: 2s
      retries: 15
